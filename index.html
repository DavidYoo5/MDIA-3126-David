<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="index.js"></script>
    <style>
      .buttonContainer {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 20px;
        font-family: Arial, sans-serif;
      }

      h1 {
        text-align: center;
        font-size: 32px;
        margin: 20px 0;
        font-family: Arial, sans-serif;
      }

      .button {
        padding: 10px 20px;
        border-radius: 30px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
        background-color: lightgray;
        color: black;

        &.button__primary {
          background-color: blue;
          color: white;
        }

        &.button__secondary {
          background-color: green;
          color: white;
        }

        &.button__disabled {
          background-color: gray;
          color: white;
        }

        &.button__quaternary {
          background-color: yellow;
          color: black;
        }
      }
    </style>
  </head>
  <body>
    <h1>David Assignment Buttons</h1>
    <div class="mainButtonContainer">
      <div class="buttonContainer">
        <h2>Primary Button</h2>
        <span class="button button__primary">Primary</span>
      </div>
      <div class="buttonContainer">
        <h2>Secondary Button</h2>
        <span class="button button__secondary">Secondary</span>
      </div>
      <div class="buttonContainer">
        <h2>Disabled Button</h2>
        <span class="button button__disabled">Disabled</span>
      </div>
      <div class="buttonContainer">
        <h2>QuaternaryButton</h2>
        <span class="button button__quaternary">Quaternary</span>
      </div>
    </div>
  </body>
</html>
